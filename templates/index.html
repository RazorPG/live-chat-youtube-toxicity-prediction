<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chat</title>
    <!-- Tambahkan Bootstrap CSS -->
    <link
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      textarea {
        width: 100%;
        min-height: 300px;
        overflow-y: scroll;
        resize: none;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center">YouTube Live Chat</h1>
      <div class="form-group">
        <label for="video-url">YouTube Video URL:</label>
        <input
          type="text"
          id="video-url"
          class="form-control"
          placeholder="Masukkan URL Video YouTube"
        />
      </div>
      <button id="start-btn" class="btn btn-primary btn-block">
        Mulai Streaming
      </button>
      <h2 class="mt-4">Komentar Live Chat:</h2>
      <textarea id="chat-box" class="form-control" readonly></textarea>
    </div>

    <!-- Tambahkan Bootstrap JS dan dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
      let interval // Untuk menyimpan ID interval

      function extractVideoId(url) {
        const regex =
          /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/
        const match = url.match(regex)
        return match ? match[1] : null
      }

      // Fungsi untuk mendapatkan live chat secara berkala
      async function fetchChats(videoId) {
        try {
          const response = await fetch('/get_chats', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ video_id: videoId }),
          })

          if (!response.ok) {
            console.error('Error fetching chats:', await response.text())
            return
          }

          const chats = await response.json()
          updateChatBox(chats)
        } catch (error) {
          console.error('Error:', error)
        }
      }

      // Fungsi untuk memperbarui textarea dengan chat baru
      function updateChatBox(chats) {
        const chatBox = document.getElementById('chat-box')
        chats.forEach(chat => {
          chatBox.value += `${chat.author}: ${chat.message} [${chat.toxicity}]\n`
        })
        chatBox.scrollTop = chatBox.scrollHeight // Gulir ke bawah otomatis
      }

      // Tombol Mulai Streaming
      document.getElementById('start-btn').addEventListener('click', () => {
        const videoUrl = document.getElementById('video-url').value
        const videoId = extractVideoId(videoUrl)
        if (!videoId) {
          alert('Masukkan URL Video YouTube yang valid!')
          return
        }

        // Hentikan interval sebelumnya jika ada
        if (interval) clearInterval(interval)

        // Mulai interval untuk fetch chats setiap 5 detik
        interval = setInterval(() => fetchChats(videoId), 5000)
      })
    </script>
  </body>
</html>
